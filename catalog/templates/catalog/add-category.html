{% extends 'index.html' %}

{% block title %}Add category{% endblock %}

{% block content %}
    <main class="py-4">
        <h2>Add category</h2>
        <form method="post">
            {{ form }}
            {% csrf_token %}
            <div class="d-flex justify-content-end gap-2">
                <button type="submit" class="btn btn-primary">
                    Add category
                </button>
                <a href="{% url 'catalog:category-list' %}" class="btn btn-secondary">
                    Back
                </a>
            </div>
        </form>
    </main>
{% endblock %}

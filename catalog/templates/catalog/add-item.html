{% extends 'index.html' %}

{% block title %}Add item for repair{% endblock %}

{% block content %}
    <main class="container py-4">
        <h2>Add item for repair</h2>
        <form method="post" enctype="multipart/form-data">
            {{ form }}
            {% csrf_token %}
            <button type="submit" class="btn btn-primary">
                Add
            </button>
            <a href="{% url 'catalog:list' %}" class="btn btn-warning">
                Back
            </a>
        </form>
    </main>
{% endblock %}

{% extends 'index.html' %}

{% block title %}Add item for repair{% endblock %}

{% block content %}
    <main class="py-4">
        <h2>Add item for repair</h2>
        <form method="post" enctype="multipart/form-data">
            {{ form }}
            {% csrf_token %}
            <div class="d-flex justify-content-end gap-2">
                <button type="submit" class="btn btn-primary">
                    Add
                </button>
                <a href="{% url 'catalog:details' item.id %}" class="btn btn-secondary">
                    Back
                </a>
            </div>
        </form>
    </main>
{% endblock %}

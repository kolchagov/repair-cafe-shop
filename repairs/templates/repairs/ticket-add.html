{% extends 'index.html' %}

{% block title %}Add repair ticket{% endblock %}

{% block content %}
    <main class="container py-4">
        <h2>Add repair ticket</h2>
        <form method="post">
            {{ form }}
            {% csrf_token %}
            <button type="submit" class="btn btn-primary">Add</button>
            <a href="{% url 'dashboard' %}" class="btn btn-warning">Back</a>
        </form>
    </main>
{% endblock %}

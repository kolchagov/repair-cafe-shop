{% extends 'index.html' %}

{% block title %}Find a repair ticket{% endblock %}

{% block content %}
    <main class="py-4">
        <h1>Find a repair ticket</h1>

        <div class="card mb-4">
            <div class="card-body">
                <form class="row g-2 align-items-end" method="get">
                    <div class="col-md-8">
                        <label class="form-label" for="{{ form.code.id_for_label }}">
                            {{ form.code.label }}
                        </label>
                        {{ form.code }}
                        {% if form.code.errors %}
                            <div class="invalid-feedback d-block">{{ form.code.errors.0 }}</div>
                        {% endif %}
                    </div>
                    <div class="col-auto">
                        <button type="submit" class="btn btn-primary">Check status</button>
                    </div>
                </form>
            </div>
        </div>

        <div class="d-flex justify-content-end mt-4">
            <a href="{% url 'dashboard' %}" class="btn btn-secondary">Back</a>
        </div>
    </main>
{% endblock %}

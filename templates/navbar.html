    <script>
        (window.onload = () => {
            // handle active path item with JS
            const url = window.location.pathname;
            const links = document.querySelectorAll('.nav-link:not(.dropdown-toggle), .dropdown-item');
            links.forEach(link => {
                if (new URL(link.href).pathname === url) {
                    link.classList.add('active');
                }
            });
        })()

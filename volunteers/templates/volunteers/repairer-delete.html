{% extends 'index.html' %}

{% block title %}Delete {{ repairer.name }}{% endblock %}

{% block content %}
    <main class="py-4">
        <h2>Delete repairer</h2>
        <form action="{% url 'volunteers:delete' repairer.pk %}" method="post">
            {% csrf_token %}
            <h3>{{ repairer.name }}</h3>
            <p>{{ repairer.phone }} · {{ repairer.get_skills_display }}</p>
            <div class="alert alert-danger">Warning: this action cannot be undone!</div>
            <div class="d-flex justify-content-end gap-2">
                <button type="submit" class="btn btn-danger">Confirm delete</button>
                <a href="{% url 'volunteers:list' %}" class="btn btn-secondary">Back</a>
            </div>
        </form>
    </main>
{% endblock %}

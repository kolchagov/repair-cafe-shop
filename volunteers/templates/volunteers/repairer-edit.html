{% extends 'index.html' %}

{% block title %}{% if object %}Edit repairer{% else %}Add repairer{% endif %}{% endblock %}

{% block content %}
    <main class="py-4">
        <h2>{% if object %}Edit repairer{% else %}Add repairer{% endif %}</h2>
        <form method="post">
            {% csrf_token %}
            {{ form }}
            <button type="submit" class="btn btn-primary">
                {% if object.id %}
                    Update
                {% else %}
                    Add
                {% endif %}
            </button>
            <a href="{% url 'volunteers:list' %}" class="btn btn-secondary">
                Back
            </a>
        </form>
    </main>
{% endblock %}
